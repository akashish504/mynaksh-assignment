name: Keep alive

# AuraDB Free pauses a database after about 3 days without activity.
# GET /health runs a query against both databases, so calling it every 6 hours
# keeps AuraDB awake. It runs from GitHub, not from the VM, so a failure here
# also tells us when the VM or the API is down.
#
# Note: GitHub turns scheduled workflows off after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours, UTC
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /health
        # API_URL is a repository variable (Settings > Secrets and variables > Actions > Variables),
        # so the server's address is not written in the code.
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            "${{ vars.API_URL }}/health"
