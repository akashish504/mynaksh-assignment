name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # Throwaway databases for this run only. Never Neon or AuraDB.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mynaksh
          POSTGRES_PASSWORD: mynaksh
          POSTGRES_DB: mynaksh
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mynaksh -d mynaksh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/mynaksh-dev-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p mynaksh-dev-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s

    env:
      DATABASE_URL: postgresql://mynaksh:mynaksh@localhost:5433/mynaksh
      DATABASE_URL_DIRECT: postgresql://mynaksh:mynaksh@localhost:5433/mynaksh
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mynaksh-dev-password
      JWT_SECRET: ci-only-secret-for-throwaway-test-databases

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
