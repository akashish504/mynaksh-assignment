# Local development: API + Postgres + Neo4j.
# The credentials below are for these local containers only.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Postgres is published on host port 5433 (not 5432) so it does not clash with a
# Postgres already installed on the machine.

services:
  api:
    build: ./backend
    # Apply migrations, then start the server with auto-reload.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - path: .env
        required: false
    environment:
      # These override anything in .env, so the dev stack always uses the local databases.
      DATABASE_URL: postgresql://mynaksh:mynaksh@postgres:5432/mynaksh
      DATABASE_URL_DIRECT: postgresql://mynaksh:mynaksh@postgres:5432/mynaksh
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mynaksh-dev-password
      JWT_SECRET: local-development-secret-not-for-production
      # The Vite dev server (npm run dev in frontend/) runs here.
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mynaksh
      POSTGRES_PASSWORD: mynaksh
      POSTGRES_DB: mynaksh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mynaksh -d mynaksh"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/mynaksh-dev-password
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mynaksh-dev-password 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  neo4j_data:
